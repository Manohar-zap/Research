name: NSE Paper Trading

on:
  workflow_dispatch:
  schedule:
    # 3:45 PM IST, Monday-Friday (GitHub cron uses UTC)
    - cron: "15 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nse-paper-trading
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: paper-trader
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run simulation
        run: python paper_trader.py
      - name: Commit reports and ledger
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper-trader/reports paper-trader/state
          git diff --cached --quiet || git commit -m "Update NSE paper trading report"
          git push
