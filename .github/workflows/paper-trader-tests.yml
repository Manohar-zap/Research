name: Paper Trader Tests

on:
  push:
    paths:
      - "paper-trader/**"
      - ".github/workflows/paper-trader-tests.yml"
  pull_request:
    paths:
      - "paper-trader/**"
      - ".github/workflows/paper-trader-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: paper-trader/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r paper-trader/requirements.txt
      - name: Run paper-trader unit tests
        working-directory: paper-trader
        run: python -m unittest discover -s tests -v
